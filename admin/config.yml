backend:
  name: git-gateway
  branch: main

# For local development, uncomment this:
# backend:
#   name: test-repo

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Authentication for Netlify Identity
site_url: https://thefounders.ca
logo_url: https://thefounders.ca/logo.png

# Collections define the content types you can edit
collections:
  # ============================================
  # HOMEPAGE - All editable sections
  # ============================================
  - name: "homepage"
    label: "Homepage"
    files:
      - file: "content/homepage/hero.md"
        label: "Hero Section"
        name: "hero"
        fields:
          - { label: "Trust Badge Text", name: "badge", widget: "string", default: "Clear mortgage guidance for Canadian homebuyers" }
          - { label: "Headline Line 1", name: "headline1", widget: "string", default: "Your home. Your future." }
          - { label: "Headline Line 2 (Italic Accent)", name: "headline2", widget: "string", default: "Made possible." }
          - { label: "Description", name: "description", widget: "text", default: "The Funders helps first-time buyers, newcomers, and all Canadians navigate mortgages without jargon, judgment, or pressure. with clear property-specific education and a practical next step." }
          - label: "Primary CTA"
            name: "primary_cta"
            widget: "object"
            fields:
              - { label: "Button Text", name: "text", widget: "string", default: "Book your free strategy call" }
              - { label: "Button URL", name: "url", widget: "string", default: "#contact" }
          - label: "Secondary CTA"
            name: "secondary_cta"
            widget: "object"
            fields:
              - { label: "Button Text", name: "text", widget: "string", default: "Explore a property report" }
              - { label: "Button URL", name: "url", widget: "string", default: "/report-builder/" }
          - { label: "Trust Text", name: "trust_text", widget: "string", default: "property conversations made clearer" }
          - { label: "Trust Number", name: "trust_number", widget: "string", default: "Buyer-first" }

      - file: "content/homepage/marquee.md"
        label: "Marquee / Trust Signals"
        name: "marquee"
        fields:
          - label: "Trust Signals"
            name: "items"
            widget: "list"
            fields:
              - { label: "Icon (SVG path or name)", name: "icon", widget: "string" }
              - { label: "Text", name: "text", widget: "string" }
            default:
              - { icon: "layers", text: "Broad Lender Network" }
              - { icon: "clock", text: "Responsive Review" }
              - { icon: "shield", text: "Clear Upfront Communication" }
              - { icon: "users", text: "All Clients Welcome" }
              - { icon: "monitor", text: "Digital-First Experience" }
              - { icon: "message-circle", text: "Clear Next Steps" }

      - file: "content/homepage/all-clients.md"
        label: "All Clients Welcome Banner"
        name: "all_clients"
        fields:
          - { label: "Banner Text", name: "text", widget: "text", default: "Whether you are a first-time buyer, newcomer, refinancer, investor, self-employed, or have unique circumstances — we work with everyone and find solutions that fit your life." }

      - file: "content/homepage/who-we-help.md"
        label: "Who We Help Section"
        name: "who_we_help"
        fields:
          - { label: "Section Label", name: "label", widget: "string", default: "Who We Help" }
          - { label: "Section Title", name: "title", widget: "string", default: "A mortgage that fits your story." }
          - { label: "Section Description", name: "description", widget: "text", default: "Homeownership is not one-size-fits-all. Get advice designed around where you are now and where you want to go next." }
          - label: "Cards"
            name: "cards"
            widget: "list"
            fields:
              - { label: "Number", name: "number", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Link Text", name: "link_text", widget: "string" }
              - { label: "Link URL", name: "link_url", widget: "string" }
            default:
              - { number: "01", title: "First-time homebuyers", description: "Understand your down payment, early buying picture, and every step from planning through closing day. No question is too small.", link_text: "Start with confidence", link_url: "#" }
              - { number: "02", title: "Newcomers to Canada", description: "Explore lenders that understand global income, foreign assets, and a limited Canadian credit history. We make the unfamiliar familiar.", link_text: "Explore your options", link_url: "#" }
              - { number: "03", title: "Women building wealth", description: "Get practical education and an informed strategy for buying solo, refinancing, or investing in property. Your financial independence starts here.", link_text: "Build your strategy", link_url: "#" }

      - file: "content/homepage/report-tool.md"
        label: "Free Report Tool Showcase"
        name: "report_tool"
        fields:
          - { label: "Eyebrow Badge", name: "eyebrow", widget: "string", default: "Property Financing Report \u00b7 Educational starting point" }
          - { label: "Headline Line 1", name: "headline1", widget: "string", default: "See a clearer starting point" }
          - { label: "Headline Line 2 (Italic Accent)", name: "headline2", widget: "string", default: "for any home." }
          - { label: "Description", name: "description", widget: "text", default: "Build a property-specific financing scenario to explore estimated cash to close, monthly ownership cost, and the next questions to review with The Funders Team. It is educational, not a mortgage approval or lender commitment." }
          - label: "Feature Bullets"
            name: "features"
            widget: "list"
            fields:
              - { label: "Text", name: "text", widget: "string" }
            default:
              - { text: "Illustrative ownership costs and closing-cost context for a specific property" }
              - { text: "Plain-language comparison of available scenario options and trade-offs" }
              - { text: "A practical next step for a licensed review when you are ready" }
          - label: "Audience Chips"
            name: "audience_chips"
            widget: "list"
            fields:
              - { label: "Text", name: "text", widget: "string" }
            default:
              - { text: "Buying a home" }
              - { text: "Selling a home" }
              - { text: "A realtor" }
          - { label: "CTA Button Text", name: "cta_text", widget: "string", default: "Build a property scenario" }
          - { label: "CTA Button URL", name: "cta_url", widget: "string", default: "/report-builder/" }

      - file: "content/homepage/stats.md"
        label: "Stat Strip"
        name: "stats"
        fields:
          - label: "Stats"
            name: "items"
            widget: "list"
            fields:
              - { label: "Number", name: "number", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
            default:
              - { number: "Broad", label: "lender options to explore" }
              - { number: "Clear", label: "next-step guidance" }
              - { number: "Property", label: "specific financing education" }
              - { number: "$0", label: "cost for many standard files" }

      - file: "content/homepage/estimator.md"
        label: "Quick Estimate (Affordability Slider)"
        name: "estimator"
        fields:
          - { label: "Eyebrow Badge", name: "eyebrow", widget: "string", default: "Illustrative estimate" }
          - { label: "Headline Line 1", name: "headline1", widget: "string", default: "Curious what a monthly payment" }
          - { label: "Headline Line 2 (Italic Accent)", name: "headline2", widget: "string", default: "could support?" }
          - { label: "Description", name: "description", widget: "text", default: "Use this education-only estimate to start a conversation. A lender and licensed review are required to assess an actual mortgage application." }
          - { label: "Slider Min ($/month)", name: "slider_min", widget: "number", default: 1500 }
          - { label: "Slider Max ($/month)", name: "slider_max", widget: "number", default: 8000 }
          - { label: "Slider Default ($/month)", name: "slider_default", widget: "number", default: 3200 }
          - { label: "Assumed Rate (%)", name: "assumed_rate", widget: "number", default: 5.0, value_type: "float" }
          - { label: "Assumed Amortization (years)", name: "assumed_amortization", widget: "number", default: 25 }
          - { label: "Assumed Down Payment (%)", name: "assumed_down_percent", widget: "number", default: 20 }
          - { label: "Result Note", name: "result_note", widget: "string", default: "illustrative estimate using {rate}% and a {years}-year amortization — not a lending decision" }

      - file: "content/homepage/process.md"
        label: "How It Works Section"
        name: "process"
        fields:
          - { label: "Section Label", name: "label", widget: "string", default: "How It Works" }
          - { label: "Section Title", name: "title", widget: "string", default: "From questions to keys." }
          - { label: "Section Description", name: "description", widget: "text", default: "A straightforward process, expert guidance, and clear updates at every stage." }
          - label: "Steps"
            name: "steps"
            widget: "list"
            fields:
              - { label: "Number", name: "number", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
            default:
              - { number: "01", title: "Quick chat", description: "Share your goals in a free 15-minute call or short application. We will listen first, then advise." }
              - { number: "02", title: "Review your next step", description: "Review available options, the information required, and the path toward a formal lender decision when you are ready." }
              - { number: "03", title: "Shop confidently", description: "House-hunt with a clear budget and a rate hold of up to 120 days. No surprises." }
              - { number: "04", title: "Close & celebrate", description: "Get support through the paperwork, lender conditions, and closing. Then get your keys." }

      - file: "content/homepage/testimonials.md"
        label: "Testimonials Section"
        name: "testimonials"
        fields:
          - { label: "Section Label", name: "label", widget: "string", default: "Client Stories" }
          - { label: "Section Title", name: "title", widget: "string", default: "Real people. Real front doors." }
          - { label: "Section Description", name: "description", widget: "text", default: "Thoughtful advice changes the experience — and sometimes what buyers believe is possible." }
          - label: "Testimonials"
            name: "items"
            widget: "list"
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Author Initial", name: "initial", widget: "string" }
              - { label: "Author Name", name: "name", widget: "string" }
              - { label: "Author Detail", name: "detail", widget: "string" }
              - { label: "Rating (1-5)", name: "rating", widget: "number", default: 5, min: 1, max: 5 }
            default:
              - { quote: "I had no Canadian credit history and thought buying a home was impossible. The Funders found a lender who accepted my foreign income.", initial: "A", name: "Aisha M.", detail: "Newcomer & first-time buyer", rating: 5 }
              - { quote: "They treated me with respect, explained everything twice, and never made me feel rushed. I finally understood my mortgage.", initial: "S", name: "Sarah L.", detail: "First-time buyer, Vancouver", rating: 5 }
              - { quote: "We got pre-approved in 48 hours and closed two weeks early. Absolute lifesavers during a stressful time.", initial: "M", name: "Marcus & Jen T.", detail: "First-time family, Calgary", rating: 5 }

      - file: "content/homepage/faq.md"
        label: "FAQ Section"
        name: "faq"
        fields:
          - { label: "Section Label", name: "label", widget: "string", default: "FAQ" }
          - { label: "Section Title", name: "title", widget: "string", default: "Questions? We have answers." }
          - { label: "Section Description", name: "description", widget: "text", default: "Everything you need to know before starting your mortgage journey." }
          - label: "FAQ Items"
            name: "items"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }
            default:
              - { question: "What is the minimum down payment in Canada?", answer: "For homes under $500,000, the minimum down payment is 5%. Between $500,000 and $999,999, it is 5% on the first $500,000 and 10% on the remainder. Homes $1 million and above require 20% down." }
              - { question: "Can newcomers to Canada get a mortgage?", answer: "Yes. Many Canadian lenders offer newcomer mortgage programs that accept limited Canadian credit history, foreign income, and international assets. We help newcomers navigate these specialized options." }
              - { question: "How long does a formal mortgage review take?", answer: "Timing depends on the information available, lender requirements, and the buyer's situation. The Funders Team will explain what is needed for review and keep you informed as the file progresses. A property scenario or report is not a pre-approval or lender decision." }
              - { question: "Do you charge fees for your services?", answer: "For most standard mortgages, our services are free to you — we are compensated by the lender. In some complex situations, a fee may apply, which we will always disclose upfront." }
              - { question: "What is the difference between fixed and variable rates?", answer: "A fixed rate stays the same for your entire term, giving you predictable payments. A variable rate fluctuates with the prime rate, which can mean lower costs when rates drop but higher costs when they rise. We will help you decide which fits your risk tolerance." }
              - { question: "Can I get a mortgage if I am self-employed?", answer: "Absolutely. We work with lenders who understand self-employed income, including those who accept stated income or alternative documentation. Your business does not disqualify you from homeownership." }

      - file: "content/homepage/cta.md"
        label: "Final CTA Section"
        name: "cta"
        fields:
          - { label: "Headline", name: "headline", widget: "string", default: "Ready to make your next move?" }
          - { label: "Description", name: "description", widget: "text", default: "Start with a free strategy call. Ask questions, understand your options, and leave with a clearer path forward." }
          - label: "CTA Button"
            name: "button"
            widget: "object"
            fields:
              - { label: "Button Text", name: "text", widget: "string", default: "Book your free strategy call" }
              - { label: "Button URL", name: "url", widget: "string", default: "#" }
          - { label: "Subtext", name: "subtext", widget: "string", default: "No obligation. No pressure. 100% confidential." }

      - file: "content/homepage/footer.md"
        label: "Footer"
        name: "footer"
        fields:
          - { label: "Brand Description", name: "description", widget: "text", default: "A clearer path to homeownership for first-time buyers, newcomers, refinancers, investors, and all Canadians." }
          - label: "Company Links"
            name: "company_links"
            widget: "list"
            fields:
              - { label: "Text", name: "text", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
          - label: "Resource Links"
            name: "resource_links"
            widget: "list"
            fields:
              - { label: "Text", name: "text", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
          - label: "Legal Links"
            name: "legal_links"
            widget: "list"
            fields:
              - { label: "Text", name: "text", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
          - { label: "Licensing Disclosure", name: "licensing", widget: "string", default: "thefunders.ca operates under BRX Mortgage Inc., FSRA Licence #13463." }
          - { label: "Copyright Text", name: "copyright", widget: "string", default: "© 2026 thefunders.ca. All rights reserved." }

  # ============================================
  # BLOG POSTS
  # ============================================
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "thumbnail", widget: "image", required: false }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Author", name: "author", widget: "string", default: "The Funders Team" }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "SEO Title", name: "seo_title", widget: "string", required: false }
      - { label: "SEO Description", name: "seo_description", widget: "text", required: false }
      - { label: "Canonical URL", name: "canonical", widget: "string", required: false }
  # ============================================
  # SITE SETTINGS (rates & assumptions)
  # ============================================
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "rates"
        label: "Mortgage Rates"
        file: "_data/rates.json"
        fields:
          - { label: "Last Updated", name: "updated", widget: "string" }
          - label: "Rates"
            name: "rates"
            widget: "list"
            fields:
              - { label: "Term", name: "term", widget: "string" }
              - { label: "Rate %", name: "rate", widget: "number", value_type: "float" }
              - { label: "Lender", name: "lender", widget: "string" }
              - { label: "Logo Class", name: "logo", widget: "string", hint: "rbc, td, scotia, cibc, bmo, or funders" }
              - { label: "Best Rate?", name: "best", widget: "boolean", default: false }
          - { label: "Amortization Years", name: "amortizationYears", widget: "number", default: 25 }
          - { label: "Stress Test Floor %", name: "stressTestFloor", widget: "number", value_type: "float", default: 5.25 }
          - { label: "Appreciation Rate", name: "appreciationRate", widget: "number", value_type: "float", default: 0.03 }
          - { label: "Selling Cost Rate", name: "sellingCostRate", widget: "number", value_type: "float", default: 0.05 }
          - { label: "Heat Estimate", name: "heatEstimate", widget: "number", default: 150 }
          - { label: "Insurance Estimate", name: "insuranceEstimate", widget: "number", default: 180 }
          - { label: "Utilities Estimate", name: "utilitiesEstimate", widget: "number", default: 280 }
          - { label: "Tenant Insurance", name: "tenantInsurance", widget: "number", default: 35 }
          - { label: "Parking Estimate", name: "parkingEstimate", widget: "number", default: 150 }
          - { label: "Basement Rent", name: "basementRent", widget: "number", default: 1650 }
