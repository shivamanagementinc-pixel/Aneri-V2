[build]
  command = "npm run build"
  publish = "_site"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Keep the report ID in the rewritten path. Netlify does not reliably pass a
# :splat value into a function query string during an internal (200) rewrite.
[[redirects]]
  from = "/r/*"
  to = "/.netlify/functions/view-report/:splat"
  status = 200

# Funders Network application entry points. The app itself remains on a
# separate Netlify site/subdomain so it does not conflict with this site's
# Decap CMS route at /admin/.
[[redirects]]
  from = "/partner-login"
  to = "https://app.thefunders.ca/login.html?portal=realtor"
  status = 302
  force = true

[[redirects]]
  from = "/funders-network"
  to = "/for-realtors/"
  status = 301
  force = true

[[headers]]
  for = "/*"

  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
